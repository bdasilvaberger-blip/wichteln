<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wichteln 2026 admin</title>
<style>
@font-face{font-family:Jost;font-weight:400;src:url(/wichteln26/fonts/jost-400.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;src:url(/wichteln26/fonts/jost-500.woff2) format('woff2')}
body{font-family:Jost,system-ui,sans-serif;margin:0;padding:32px 20px;color:#000;background:#fff;max-width:560px;margin-inline:auto}
h1{font-weight:500;font-size:26px;margin:0 0 20px}
input,button{font:inherit;font-size:16px}
input{border:0;border-bottom:1.5px solid #000;padding:8px 0;width:100%;margin-bottom:12px}
button{border:1.5px solid #000;border-radius:999px;background:#000;color:#fff;padding:8px 18px;cursor:pointer}
button.ghost{background:#fff;color:#000}
table{width:100%;border-collapse:collapse;margin:20px 0}
td{padding:10px 0;border-bottom:1px solid #ddd}
td:last-child{text-align:right}
#msg{min-height:1.5em;color:#ff4fa8}
.row{display:flex;gap:10px;flex-wrap:wrap}
</style>
<script src="/wichteln26/admin.js" defer></script>
</head>
<body>
<h1>Wichteln 2026 admin</h1>
<form id="f"><input id="key" type="password" autocomplete="current-password" placeholder="Key" aria-label="Key"><button type="submit">Show</button></form>
<p id="msg" role="status"></p>
<p id="sum"></p>
<table id="t"></table>
<div class="row"><button class="ghost" type="button" id="reset" hidden>Delete everything</button></div>
</body>
</html>
